run_name: dlinear
dataset: electricity_load_diagrams
feature_set: raw
training_objective: wape
seed: 16
context_length: 168
prediction_length: 336
stride: 96
max_epochs: 100
batch_size: 256
inference_batch_size: 96
learning_rate: 0.001
weight_decay: 0.0001
gradient_clip_norm: 1.0
selection_metric: WAPE
prediction_floor: 0.0
early_stopping_patience: 12
early_stopping_min_delta: 0.0001
model:
  type: dlinear
  moving_average: 25
  use_series_embedding: true
  embedding_size: 16
  exogenous_hidden_size: 64
  dropout: 0.1
